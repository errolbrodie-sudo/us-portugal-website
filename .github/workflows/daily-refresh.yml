name: Daily 01:00 AM Data & Date Refresh

on:
  schedule:
    # Runs at 01:00 AM UTC every day
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run daily update script
        run: node scripts/daily-update.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/*.json *.html
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: automated daily data & date refresh [skip ci]"
            git pull --rebase origin master
            git push origin master
          else
            console.log("No changes detected.")
          fi