<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Your Account | ReloPlan</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { background-color: #EAE3DD; font-family: 'Outfit', sans-serif; color: var(--color-text-white); }
    .account-container {
      max-width: 520px;
      margin: 40px auto;
      padding: 32px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    @media (max-width: 600px) { .account-container { margin: 24px 16px; padding: 22px; } }
    h1 { font-size: 1.6rem; margin: 0 0 4px; color: #0d5c46; }
    .who { color: var(--color-text-dim); margin: 0 0 24px; overflow-wrap: anywhere; }
    h2 { font-size: 1.15rem; margin: 0 0 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    .field { margin-bottom: 16px; }
    .input-row { position: relative; }
    input {
      width: 100%; padding: 12px 76px 12px 12px; border: 1px solid var(--color-border); border-radius: 8px;
      background: rgba(255, 255, 255, 0.85); font: inherit; font-size: 1rem; box-sizing: border-box;
    }
    .toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: #C0DDD5;
      color: #072b22; font: inherit; font-size: 0.85rem; font-weight: 600; padding: 6px 10px; border-radius: 8px; cursor: pointer;
    }
    .hint { font-size: 0.85rem; color: var(--color-text-dim); margin-top: 6px; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .btn-solid, .btn-ghost {
      border-radius: 8px; padding: 11px 20px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn-solid { background: #0d5c46; color: #fff; border: 0; }
    .btn-ghost { background: transparent; color: #0d5c46; border: 1px solid #0d5c46; }
    .message { min-height: 1.4em; font-size: 0.95rem; }
    .message.error { color: #a12a1f; }
    .message.success { color: #0d5c46; }
    hr { border: 0; border-top: 1px solid var(--color-border); margin: 28px 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="top-site-nav-wrapper"></div>

  <main class="account-container">
    <h1>Your account</h1>
    <p class="who" id="who">Loading…</p>

    <section id="password-section" hidden>
      <h2>Change password</h2>
      <form id="password-form" novalidate>
        <div class="field">
          <label for="current-password">Current password</label>
          <div class="input-row">
            <input id="current-password" type="password" autocomplete="current-password" required>
            <button class="toggle" type="button" data-target="current-password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="field">
          <label for="new-password">New password</label>
          <div class="input-row">
            <input id="new-password" type="password" autocomplete="new-password" required aria-describedby="new-password-hint">
            <button class="toggle" type="button" data-target="new-password" aria-pressed="false">Show</button>
          </div>
          <p class="hint" id="new-password-hint">Exactly 8 characters &mdash; any letters, numbers, spaces or symbols. <span id="new-count">0/8</span></p>
        </div>
        <p class="message" id="password-message" role="alert" aria-live="polite"></p>
        <div class="btn-row"><button class="btn-solid" type="submit">Update password</button></div>
      </form>
      <hr>
    </section>

    <p id="admin-note" class="hint" hidden>
      The administrator password is set in the server configuration (Vercel environment variables), not here.
      <a href="/admin.html" style="color: #0d5c46; font-weight: 600;">Open user management</a>
    </p>

    <div class="btn-row">
      <button class="btn-ghost" type="button" id="logout-btn">Log out</button>
    </div>
  </main>

  <script>
    (function () {
      'use strict';
      var PASSWORD_LENGTH = 8;
      function charCount(value) { return Array.from(value).length; }

      document.querySelectorAll('.toggle').forEach(function (button) {
        button.addEventListener('click', function () {
          var input = document.getElementById(button.dataset.target);
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          button.textContent = show ? 'Hide' : 'Show';
          button.setAttribute('aria-pressed', String(show));
        });
      });

      fetch('/api/auth/me', { credentials: 'same-origin' })
        .then(function (r) { if (r.status === 401) { location.assign('/login.html?next=/account.html'); } return r.json(); })
        .then(function (me) {
          if (!me || !me.role) return;
          document.getElementById('who').textContent = 'Signed in as ' + me.username + (me.role === 'admin' ? ' (administrator)' : '');
          document.getElementById('password-section').hidden = me.role !== 'user';
          document.getElementById('admin-note').hidden = me.role !== 'admin';
        })
        .catch(function () { document.getElementById('who').textContent = 'Could not load your account.'; });

      var newPassword = document.getElementById('new-password');
      newPassword.addEventListener('input', function () {
        document.getElementById('new-count').textContent = charCount(newPassword.value) + '/' + PASSWORD_LENGTH;
      });

      var form = document.getElementById('password-form');
      var message = document.getElementById('password-message');
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        var current = document.getElementById('current-password').value;
        var next = newPassword.value;
        if (charCount(next) !== PASSWORD_LENGTH) {
          message.textContent = 'Password must be exactly ' + PASSWORD_LENGTH + ' characters.';
          message.className = 'message error';
          return;
        }
        var response = await fetch('/api/auth/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ currentPassword: current, newPassword: next })
        });
        var data = await response.json().catch(function () { return {}; });
        message.textContent = response.ok ? 'Password updated. Other devices have been signed out.' : (data.error || 'Something went wrong.');
        message.className = 'message ' + (response.ok ? 'success' : 'error');
        if (response.ok) form.reset();
      });

      document.getElementById('logout-btn').addEventListener('click', async function () {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }).catch(function () {});
        location.replace('/login.html');
      });
    })();
  </script>
  <script type="module" src="/top-nav.js"></script>
</body>
</html>
